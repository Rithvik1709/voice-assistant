name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint and unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libportaudio2

      - name: Install Package and Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,webrtc,aec]"

      - name: Lint
        run: ruff check voice_assistant tests scripts

      - name: Check protobuf stubs are up to date
        run: python scripts/check_proto_stubs.py

      - name: Unit Tests
        env:
          # Includes the end-to-end WebRTC test (local sockets only).
          VAANI_NETWORK_TESTS: "1"
        run: pytest -q

  performance:
    name: Concurrent Load Performance Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Python 3.11
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libportaudio2

      - name: Install Package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Start gRPC Server in Mock Mode
        env:
          MOCK_MODELS: "1"
        run: |
          vaani server --port 50051 &
          sleep 3

      - name: Run ASR 50-Client Concurrent Load Test
        run: |
          python scripts/bench/load_asr.py --concurrency 50 --frames-per-client 2 --out-file bench_results.json

      - name: Assert Performance Budget (Processing p95 < 300ms)
        run: |
          python scripts/bench/assert_perf.py --res-file bench_results.json --budget 300 --active-streaming-time 200
